<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750">
  <defs>
    <!-- Strong glow filter -->
    <filter id="g3" x="-80%" y="-80%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feGaussianBlur stdDeviation="14" result="b3"/>
      <feMerge><feMergeNode in="b3"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Medium glow -->
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b1"/>
      <feGaussianBlur stdDeviation="4" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Eye glow -->
    <filter id="geye" x="-100%" y="-100%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="9" result="b2"/>
      <feGaussianBlur stdDeviation="18" result="b3"/>
      <feMerge><feMergeNode in="b3"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- CRT scanlines -->
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="rgba(0,0,0,0.5)"/>
    </pattern>

    <!-- Monitor casing gradients -->
    <linearGradient id="mon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#607065"/>
      <stop offset="45%" stop-color="#414e46"/>
      <stop offset="100%" stop-color="#232d27"/>
    </linearGradient>
    <linearGradient id="mon-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#738078"/>
      <stop offset="100%" stop-color="#414e46"/>
    </linearGradient>
    <radialGradient id="scr" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#082010"/>
      <stop offset="60%" stop-color="#030e08"/>
      <stop offset="100%" stop-color="#010503"/>
    </radialGradient>

    <!-- Body plate fills — very dark matte green-black -->
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3d28"/>
      <stop offset="100%" stop-color="#0a1f14"/>
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112a1c"/>
      <stop offset="100%" stop-color="#06130c"/>
    </linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2318"/>
      <stop offset="100%" stop-color="#040f09"/>
    </linearGradient>
  </defs>

  <!-- Pure black background -->
  <rect width="500" height="750" fill="#030f07"/>

  <!-- ===================== HEAD (CRT MONITOR) ===================== -->
  <!-- Monitor neck connector -->
  <rect x="220" y="175" width="60" height="22" fill="url(#mon)" rx="2"/>

  <!-- Monitor outer casing - top bevel -->
  <polygon points="155,80 345,80 355,90 145,90" fill="url(#mon-top)"/>
  <!-- Monitor main body -->
  <rect x="145" y="90" width="210" height="88" rx="6" fill="url(#mon)"/>
  <!-- Bottom strip with ports -->
  <rect x="145" y="162" width="210" height="16" rx="3" fill="#2a3830"/>
  <!-- Monitor inner bezel -->
  <rect x="157" y="98" width="186" height="68" rx="4" fill="#1a2820"/>
  <!-- CRT Screen -->
  <rect x="163" y="103" width="174" height="58" rx="3" fill="url(#scr)"/>
  <!-- Scanlines overlay -->
  <rect x="163" y="103" width="174" height="58" rx="3" fill="url(#scan)" opacity="0.4"/>

  <!-- LEFT EYE - pixel dot matrix -->
  <g filter="url(#geye)">
    <g fill="#00ff55" opacity="0.95">
      <!-- 4x4 pixel grid left eye -->
      <rect x="181" y="112" width="5" height="5"/><rect x="189" y="112" width="5" height="5"/><rect x="197" y="112" width="5" height="5"/><rect x="205" y="112" width="5" height="5"/>
      <rect x="181" y="120" width="5" height="5"/><rect x="189" y="120" width="5" height="5"/><rect x="197" y="120" width="5" height="5"/><rect x="205" y="120" width="5" height="5"/>
      <rect x="181" y="128" width="5" height="5"/><rect x="189" y="128" width="5" height="5"/><rect x="197" y="128" width="5" height="5"/><rect x="205" y="128" width="5" height="5"/>
      <rect x="181" y="136" width="5" height="5"/><rect x="189" y="136" width="5" height="5"/><rect x="197" y="136" width="5" height="5"/><rect x="205" y="136" width="5" height="5"/>
    </g>
  </g>

  <!-- RIGHT EYE - pixel dot matrix -->
  <g filter="url(#geye)">
    <g fill="#00ff55" opacity="0.95">
      <!-- 4x4 pixel grid right eye -->
      <rect x="289" y="112" width="5" height="5"/><rect x="297" y="112" width="5" height="5"/><rect x="305" y="112" width="5" height="5"/><rect x="313" y="112" width="5" height="5"/>
      <rect x="289" y="120" width="5" height="5"/><rect x="297" y="120" width="5" height="5"/><rect x="305" y="120" width="5" height="5"/><rect x="313" y="120" width="5" height="5"/>
      <rect x="289" y="128" width="5" height="5"/><rect x="297" y="128" width="5" height="5"/><rect x="305" y="128" width="5" height="5"/><rect x="313" y="128" width="5" height="5"/>
      <rect x="289" y="136" width="5" height="5"/><rect x="297" y="136" width="5" height="5"/><rect x="305" y="136" width="5" height="5"/><rect x="313" y="136" width="5" height="5"/>
    </g>
  </g>

  <!-- Mouth dots -->
  <g filter="url(#g2)">
    <rect x="228" y="150" width="5" height="4" fill="#00ff55" opacity="0.7"/>
    <rect x="238" y="150" width="5" height="4" fill="#00ff55" opacity="0.7"/>
    <rect x="248" y="150" width="5" height="4" fill="#00ff55" opacity="0.7"/>
  </g>

  <!-- Monitor detail: power button -->
  <circle cx="336" cy="171" r="4" fill="#1a2820" stroke="#445548" stroke-width="1"/>
  <circle cx="336" cy="171" r="2" fill="#00aa33" opacity="0.8"/>
  <!-- Floppy slot -->
  <rect x="165" y="168" width="40" height="5" rx="1" fill="#1a2820"/>

  <!-- ===================== BODY ===================== -->
  <!--
    GEOMETRY ANALYSIS from reference:
    - Neck: narrow connector ~220-280x197-210
    - Upper torso trapezoid: wide at top (shoulders 100-400), narrower at waist (155-345)
    - Shoulder blocks L and R: massive boxy chunks sticking out
    - Chest cage: wireframe with diagonal X lines
    - Vault box: rectangular box center-lower with X diagonals and padlock
    - Arms: L forward reaching, R at side bent
    - Legs: short chunky, diamond knee caps
  -->

  <!-- NECK CONNECTOR -->
  <polygon points="215,197 285,197 275,215 225,215" fill="url(#p2)" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)"/>

  <!-- ==================== UPPER TORSO CAGE ==================== -->
  <!-- Main torso shape: inverted trapezoid, VERY WIDE at top -->
  <!-- Left upper shoulder base connects at x≈130, right at x≈370 -->

  <!-- TORSO BACK PANEL (dark base) -->
  <polygon points="130,215 370,215 345,370 155,370" fill="url(#p3)" stroke="none"/>

  <!-- TORSO FRONT WIREFRAME EDGES -->
  <!-- Top edge -->
  <line x1="130" y1="215" x2="370" y2="215" stroke="#00ff55" stroke-width="2.5" filter="url(#g3)"/>
  <!-- Left slant edge -->
  <line x1="130" y1="215" x2="155" y2="370" stroke="#00ff55" stroke-width="2.5" filter="url(#g3)"/>
  <!-- Right slant edge -->
  <line x1="370" y1="215" x2="345" y2="370" stroke="#00ff55" stroke-width="2.5" filter="url(#g3)"/>
  <!-- Mid-chest horizontal divider -->
  <line x1="140" y1="275" x2="360" y2="275" stroke="#00ff55" stroke-width="2" filter="url(#g2)"/>

  <!-- Chest cage diagonal braces (X cross on upper chest) -->
  <line x1="130" y1="215" x2="360" y2="275" stroke="#00ff55" stroke-width="1.8" filter="url(#g2)" opacity="0.9"/>
  <line x1="370" y1="215" x2="140" y2="275" stroke="#00ff55" stroke-width="1.8" filter="url(#g2)" opacity="0.9"/>

  <!-- Lower torso diagonals (below mid-chest to waist) -->
  <line x1="140" y1="275" x2="345" y2="370" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.8"/>
  <line x1="360" y1="275" x2="155" y2="370" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.8"/>

  <!-- Bottom waist edge -->
  <line x1="155" y1="370" x2="345" y2="370" stroke="#00ff55" stroke-width="2" filter="url(#g2)"/>

  <!-- Center vertical line on chest -->
  <line x1="250" y1="215" x2="250" y2="370" stroke="#00ff55" stroke-width="1.2" filter="url(#g2)" opacity="0.5"/>

  <!-- ==================== LEFT SHOULDER BLOCK ==================== -->
  <!-- Big boxy chunk extending far left from x≈60 to x≈130 -->
  <!-- Front face of left shoulder -->
  <polygon points="60,210 130,215 125,290 65,282" fill="url(#p1)" stroke="#00ff55" stroke-width="2.2" filter="url(#g3)"/>
  <!-- Top face of left shoulder (3D perspective) -->
  <polygon points="68,195 148,197 130,215 60,210" fill="url(#p2)" stroke="#00ff55" stroke-width="1.8" filter="url(#g2)"/>
  <!-- Shoulder diagonal brace -->
  <line x1="60" y1="210" x2="125" y2="290" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>
  <!-- Shoulder connector plate -->
  <polygon points="130,215 155,215 155,250 125,250" fill="url(#p2)" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)"/>

  <!-- ==================== RIGHT SHOULDER BLOCK ==================== -->
  <!-- Big boxy chunk extending far right from x≈370 to x≈440 -->
  <!-- Front face of right shoulder -->
  <polygon points="370,215 440,210 435,282 345,290" fill="url(#p1)" stroke="#00ff55" stroke-width="2.2" filter="url(#g3)"/>
  <!-- Top face of right shoulder (3D perspective) -->
  <polygon points="352,197 432,195 440,210 370,215" fill="url(#p2)" stroke="#00ff55" stroke-width="1.8" filter="url(#g2)"/>
  <!-- Shoulder diagonal brace -->
  <line x1="440" y1="210" x2="345" y2="290" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>
  <!-- Shoulder connector plate -->
  <polygon points="345,215 370,215 375,250 345,250" fill="url(#p2)" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)"/>

  <!-- ==================== LEFT ARM (reaching FORWARD / toward viewer) ==================== -->
  <!-- Upper arm: angled down-forward from left shoulder -->
  <!-- Because it's coming toward viewer, forearm appears foreshortened -->
  <!-- Upper arm block -->
  <polygon points="60,228 95,245 90,310 55,295" fill="url(#p1)" stroke="#00ff55" stroke-width="2" filter="url(#g3)"/>
  <!-- Elbow joint diamond -->
  <polygon points="68,305 90,312 85,335 62,328" fill="url(#p2)" stroke="#00ff55" stroke-width="2" filter="url(#g3)"/>
  <!-- Forearm - angled toward viewer (foreshortened = wider, shorter) -->
  <polygon points="55,335 90,340 95,390 50,385" fill="url(#p1)" stroke="#00ff55" stroke-width="2" filter="url(#g3)"/>
  <!-- Hand/grip block -->
  <polygon points="48,388 92,392 90,420 46,416" fill="url(#p2)" stroke="#00ff55" stroke-width="2" filter="url(#g2)"/>
  <!-- Fingers gripping -->
  <line x1="55" y1="420" x2="58" y2="440" stroke="#00ff55" stroke-width="2" filter="url(#g2)"/>
  <line x1="65" y1="420" x2="68" y2="442" stroke="#00ff55" stroke-width="2" filter="url(#g2)"/>
  <line x1="75" y1="420" x2="77" y2="441" stroke="#00ff55" stroke-width="2" filter="url(#g2)"/>
  <line x1="85" y1="419" x2="86" y2="438" stroke="#00ff55" stroke-width="2" filter="url(#g2)"/>

  <!-- ==================== RIGHT ARM (at side, bent at elbow) ==================== -->
  <!-- Upper arm hangs down from right shoulder -->
  <polygon points="405,245 440,228 445,295 410,310" fill="url(#p1)" stroke="#00ff55" stroke-width="2" filter="url(#g3)"/>
  <!-- Elbow joint -->
  <polygon points="410,308 435,315 432,338 408,330" fill="url(#p2)" stroke="#00ff55" stroke-width="2" filter="url(#g3)"/>
  <!-- Forearm bent back/inward at hip -->
  <polygon points="408,338 440,330 445,375 412,380" fill="url(#p1)" stroke="#00ff55" stroke-width="2" filter="url(#g3)"/>
  <!-- Right hand -->
  <polygon points="412,378 445,373 448,400 414,405" fill="url(#p2)" stroke="#00ff55" stroke-width="2" filter="url(#g2)"/>

  <!-- ==================== VAULT BOX (center, lower chest) ==================== -->
  <!-- The iconic wireframe vault/chest box with X diagonals -->
  <!-- Box sits at y≈370-460, x≈170-330 -->
  <polygon points="170,370 330,370 335,460 165,460" fill="url(#p3)" stroke="#00ff55" stroke-width="3" filter="url(#g3)"/>

  <!-- Vault box internal X diagonals (front face) -->
  <line x1="170" y1="370" x2="335" y2="460" stroke="#00ff55" stroke-width="2.5" filter="url(#g3)"/>
  <line x1="330" y1="370" x2="165" y2="460" stroke="#00ff55" stroke-width="2.5" filter="url(#g3)"/>

  <!-- Vault box horizontal mid line -->
  <line x1="167" y1="415" x2="336" y2="415" stroke="#00ff55" stroke-width="2.5" filter="url(#g3)"/>

  <!-- Vault box top perspective face -->
  <polygon points="155,355 345,355 330,370 170,370" fill="url(#p2)" stroke="#00ff55" stroke-width="2.5" filter="url(#g3)"/>
  <!-- Top face diagonals -->
  <line x1="155" y1="355" x2="330" y2="370" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>
  <line x1="345" y1="355" x2="170" y2="370" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>

  <!-- PADLOCK on vault box center -->
  <g transform="translate(250, 415)">
    <!-- Padlock body -->
    <rect x="-14" y="-2" width="28" height="22" rx="3" fill="#b0b8b0" stroke="#c8d0c8" stroke-width="1.2"/>
    <!-- Padlock shackle -->
    <path d="M -6,-2 Q -6,-14 0,-14 Q 6,-14 6,-2" fill="none" stroke="#8a9290" stroke-width="3" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="10" r="4" fill="#5a6560"/>
    <rect x="-2" y="10" width="4" height="6" rx="1" fill="#5a6560"/>
  </g>

  <!-- ==================== LEGS ==================== -->
  <!-- Hip connector plate -->
  <polygon points="185,460 315,460 310,478 190,478" fill="url(#p2)" stroke="#00ff55" stroke-width="1.8" filter="url(#g2)"/>

  <!-- LEFT LEG -->
  <!-- Left thigh block - wide trapezoid -->
  <polygon points="185,478 255,478 250,545 180,540" fill="url(#p1)" stroke="#00ff55" stroke-width="2.2" filter="url(#g3)"/>
  <!-- Left thigh inner diagonal -->
  <line x1="185" y1="478" x2="250" y2="545" stroke="#00ff55" stroke-width="1.3" filter="url(#g2)" opacity="0.6"/>

  <!-- Left knee diamond cap -->
  <polygon points="175,542 258,547 262,568 172,562" fill="url(#p2)" stroke="#00ff55" stroke-width="2.5" filter="url(#g3)"/>
  <!-- Knee X -->
  <line x1="175" y1="542" x2="262" y2="568" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>
  <line x1="258" y1="547" x2="172" y2="562" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>

  <!-- Left shin block -->
  <polygon points="180,568 255,570 250,625 183,622" fill="url(#p1)" stroke="#00ff55" stroke-width="2" filter="url(#g3)"/>

  <!-- Left foot/boot - wide flat -->
  <polygon points="168,622 258,625 265,650 160,648" fill="url(#p2)" stroke="#00ff55" stroke-width="2.2" filter="url(#g2)"/>
  <!-- Boot toe highlight -->
  <line x1="168" y1="622" x2="160" y2="648" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>

  <!-- RIGHT LEG -->
  <!-- Right thigh block -->
  <polygon points="245,478 315,478 320,540 250,545" fill="url(#p1)" stroke="#00ff55" stroke-width="2.2" filter="url(#g3)"/>
  <!-- Right thigh inner diagonal -->
  <line x1="315" y1="478" x2="250" y2="545" stroke="#00ff55" stroke-width="1.3" filter="url(#g2)" opacity="0.6"/>

  <!-- Right knee diamond cap -->
  <polygon points="242,547 325,542 328,562 238,568" fill="url(#p2)" stroke="#00ff55" stroke-width="2.5" filter="url(#g3)"/>
  <!-- Knee X -->
  <line x1="242" y1="547" x2="328" y2="562" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>
  <line x1="325" y1="542" x2="238" y2="568" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>

  <!-- Right shin block -->
  <polygon points="245,570 320,568 317,622 250,625" fill="url(#p1)" stroke="#00ff55" stroke-width="2" filter="url(#g3)"/>

  <!-- Right foot/boot - wide flat -->
  <polygon points="242,625 332,622 340,648 235,650" fill="url(#p2)" stroke="#00ff55" stroke-width="2.2" filter="url(#g2)"/>
  <!-- Boot toe highlight -->
  <line x1="332" y1="622" x2="340" y2="648" stroke="#00ff55" stroke-width="1.5" filter="url(#g2)" opacity="0.7"/>

  <!-- ==================== AMBIENT GROUND GLOW ==================== -->
  <ellipse cx="250" cy="665" rx="130" ry="12" fill="#00ff55" opacity="0.08" filter="url(#g3)"/>

</svg>
