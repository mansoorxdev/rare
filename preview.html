<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RARE — Exact Robot Match</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #030f07; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px; font-family: monospace; }
    h1 { color: #00ff55; font-size: 20px; margin-bottom: 8px; letter-spacing: 0.08em; }
    p { color: #71a882; font-size: 13px; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; width: 100%; }
    .card { background: #09120c; border: 1px solid #1a3322; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .label { color: #00ff55; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid #1a3322; padding-bottom: 8px; }
    .label.ref { color: #aab8ff; }
    .frame { width: 100%; height: 480px; background: #030f07; border: 1px solid #163821; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .frame img { width: 100%; height: 100%; object-fit: contain; }
    a.open-btn { display: block; text-align: center; padding: 10px; background: #00ff55; color: #000; font-weight: 900; font-size: 13px; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>⬡ RARE Protocol — Exact Character Match</h1>
  <p>Left: Pure Vector SVG &nbsp;|&nbsp; Right: Original Video Screenshot</p>
  <div class="grid">
    <div class="card">
      <div class="label">1. Vector SVG (Exact Ditto)</div>
      <div class="frame"><img src="public/rare-crt-robot-exact.svg" alt="Exact SVG"/></div>
      <a href="public/rare-crt-robot-exact.svg" target="_blank" class="open-btn">Open Full SVG ↗</a>
    </div>
    <div class="card">
      <div class="label ref">2. Original Video Screenshot</div>
      <div class="frame"><img src="public/rare-exact-ref.jpg" alt="Original"/></div>
    </div>
  </div>
</body>
</html>
