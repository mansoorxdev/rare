<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RARE Robot Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030f07; color: #00ff55; font-family: monospace; padding: 20px; }
  h1 { text-align: center; padding: 16px; color: #00ff55; text-shadow: 0 0 20px #00ff55; font-size: 1.3rem; letter-spacing: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1000px; margin: 20px auto; }
  .panel { text-align: center; border: 1px solid #00ff5533; padding: 15px; border-radius: 8px; background: #05150a; }
  .panel h2 { margin-bottom: 12px; font-size: 0.85rem; color: #00cc44; letter-spacing: 1px; }
  .panel img { max-width: 100%; border-radius: 4px; display: block; margin: 0 auto; }
  .label { margin-top: 8px; font-size: 0.75rem; color: #006622; }
</style>
</head>
<body>
<h1>🤖 RARE CRT VAULT ROBOT — SVG vs REFERENCE</h1>
<div class="grid">
  <div class="panel">
    <h2>📸 REFERENCE (Video)</h2>
    <img src="public/rare-exact-ref.jpg" alt="Reference" onerror="this.style.border='1px solid #333'; this.style.height='400px'; this.alt='Reference image not found'"/>
    <div class="label">Source: The Rare Intro Video_2.mp4</div>
  </div>
  <div class="panel">
    <h2>✏️ OUR SVG (Latest)</h2>
    <img src="public/rare-crt-robot-exact.svg" alt="SVG Robot" style="max-height: 500px;"/>
    <div class="label">public/rare-crt-robot-exact.svg</div>
  </div>
</div>
</body>
</html>
